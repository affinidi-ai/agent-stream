branch: fix/oidc-require-tenant-binding
changes:
  added: []
  changed: []
  fixed: []
  removed: []
  security:
    - timestamp: '2026-11-09T13:45:00.000Z'
      title: Require a tenant binding for OpenID Connect sign-in
      description: >-
        An oidc.json without required_claims let any tenant's account that role_mapping
        mapped sign in at a multi-tenant provider, so every tenant's admin became an Agent
        Stream administrator. Startup now refuses such a file; set required_claims, or
        allow_any_account to true for a single-tenant provider. Affected: unreleased
        builds after v1.0.0, up to 9077ea4; no release contains it.
  breaking:
    - timestamp: '2026-11-09T13:45:00.000Z'
      title: Stop startup when oidc.json has no required_claims
      description: >-
        An oidc.json with no required_claims, or an empty one, now stops startup instead of
        logging a warning. Migration: add required_claims naming a claim that identifies your
        tenant, for example {"t3n_org": ["<org id>"]}, or set "allow_any_account": true to
        keep letting every account at the provider sign in.
