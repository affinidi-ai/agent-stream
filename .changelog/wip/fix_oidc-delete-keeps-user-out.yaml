  fixed:
    - timestamp: '2026-11-09T12:00:00.000Z'
      title: Keep a deleted OpenID Connect or SAML user out at the next sign-in
      description: >-
        Deleting a user who signs in with OpenID Connect or SAML used to remove the record,
        so their next sign-in created a new approved user with their mapped role. Delete now
        clears the user's profile data and passkeys and keeps a disabled record under their
        provider account, so the next sign-in is refused until an administrator approves them
        again. The record does not count toward the user limit, and approving it checks the
        limit. Deleting any user now also removes their uploaded avatar image, revokes the
        access tokens bound to them, and sends the user.deleted event once. The Users page
        shows the provider account on a kept record. A SAML sign-in by any user who is not
        approved, deleted or merely disabled, is now refused with a 403 page instead of
        opening a session. A user deleted before this change has no record left, so disable
        them again if they signed in anew.
