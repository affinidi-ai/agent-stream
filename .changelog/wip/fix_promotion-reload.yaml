branch: fix/promotion-reload
changes:
  added: []
  changed: []
  fixed:
    - timestamp: '2026-11-03T07:44:38.000Z'
      title: Reload shared state from disk when a Standby is promoted to Active
      description: >-
        A promoted Standby now re-reads Members, Teams, dashboard users and sessions,
        policy engines, usage and monitoring series, the request log, system metrics,
        dashboard settings, credential revocations, governance chains, prompts, terms,
        provisioning and drift records, so data written on the previous Active is kept.
    - timestamp: '2026-11-03T07:44:38.000Z'
      title: Stop a Standby from writing shared monitoring, governance and drift state
      description: >-
        Metrics persistence, governance and drift retention, and drift evaluation now
        run only on the Active, so a Standby sharing storage no longer overwrites what
        the Active writes.
    - timestamp: '2026-11-03T12:00:00.000Z'
      title: Retry a promotion when monitoring history cannot be read from storage
      description: >-
        A storage read error on the request log, time series, system metrics history
        or member provisioning config now holds readiness back and is retried, instead
        of starting empty and overwriting the previous Active's history on the next save.
    - timestamp: '2026-11-03T14:00:00.000Z'
      title: Recompile every enabled Surface and gateway policy when a Standby is promoted
      description: >-
        Promotion now rebuilds the policy engine of every enabled Surface and gateway,
        not only those with a policy on the base target. A Surface whose policy comes
        from its default variant gets the current policy, and a gateway whose policy
        was removed no longer enforces it.
  removed: []
  security: []
  breaking: []
