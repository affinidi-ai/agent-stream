branch: fix/oidc-delete-outcome
changes:
  added: []
  changed:
    - timestamp: '2026-11-23T10:30:00.000Z'
      title: Report whether deleting a user removed or kept the record
      description: >-
        The delete response reports an outcome of removed or disabled, so an API client can
        tell that an OpenID Connect or SAML user's record was kept. Deleting a kept record again answers
        disabled. The user.deleted event is now decided under the user lock, so concurrent
        deletes fire it once. The user API also returns has_oidc_account for users with an OpenID Connect
        account.
    - timestamp: '2026-11-23T10:30:01.000Z'
      title: Tell the admin when deleting an OIDC user keeps the record
      description: >-
        The delete confirm step on the Users and Edit User pages now shows a visible notice
        for a user who signs in with OpenID Connect, also on touch devices, and the success
        message on the Users page says the record was kept and disabled instead of deleted.
        Other users see no OpenID Connect wording.
  fixed: []
  removed: []
  security: []
  breaking:
    - timestamp: '2026-11-23T10:30:02.000Z'
      title: Answer user delete with 200 and an outcome instead of 204
      description: >-
        DELETE /v1/users/{user_id} now answers 200 with a JSON body {"outcome": "removed" or
        "disabled"} instead of 204 No Content. A client that checks for exactly 204 must
        accept any 2xx status.
