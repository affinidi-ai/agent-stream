branch: feat/llm-catalogue-refresh
changes:
  added:
    - timestamp: '2026-11-19T05:41:50.000Z'
      title: Count built-in catalog refreshes by result and track the accepted sequence
      description: >-
        agent_stream_llm_catalog_refresh_total counts each Refresh Builtin Models attempt by result
        (updated, unchanged, transport_failure, validation_failure, rollback_rejection, hash_mismatch,
        storage_failure), and agent_stream_llm_catalog_publication_sequence reports the accepted
        publication, so operators can see refreshes that were refused and why.
  changed:
    - timestamp: '2026-11-19T05:41:50.000Z'
      title: Refresh only models, endpoints and prices of built-in providers
      description: >-
        Refresh Builtin Models now merges the published catalog instead of replacing llm.json. A stored
        provider takes only models, endpoints, endpoint_parameters and description from the download;
        its name, enabled flag, base URL, API schema and version prefix, API key settings and
        requires_forward_caller_token stay as stored. Changes an administrator made to models and prices
        of a built-in provider are replaced; keep those in the custom catalog. A provider new in the
        download is added disabled after its base URL passes the public-address check, and a provider
        missing from the download is kept. A second refresh of the same publication reports that the
        catalog is already up to date; after a rollback, the next refresh installs it again.
    - timestamp: '2026-11-19T14:00:00.000Z'
      title: Answer 502 when the catalog source causes a refresh to be refused
      description: >-
        POST /api/v1/llm-providers/refresh now answers 502 instead of 400 for a hash or size mismatch, a
        rollback or replayed publication, and a manifest or catalog that fails validation, since each is
        an upstream fault; 400 remains for a missing llm_catalog.refresh_url. Hash mismatches and
        rollback refusals are logged at error. A storage failure on any LLM provider route now returns a
        fixed message and logs the file path instead of returning it, and refresh errors no longer
        include the manifest or catalog URL, so a credential in its query string is not exposed.
  fixed:
    - timestamp: '2026-11-19T09:00:00.000Z'
      title: Keep the built-in catalog and its refresh record in step on failure
      description: >-
        A refresh whose record llm_catalog_refresh.json cannot be saved now fails with storage_failure
        and leaves the catalog unchanged, instead of leaving the new catalog live with the old record. A
        rollback now marks the accepted publication rolled back even when llm_catalog.refresh_url is not
        set, and fails without changing the catalog if the record cannot be updated, so the next refresh
        always installs the accepted publication again.
    - timestamp: '2026-11-19T16:00:00.000Z'
      title: Keep the built-in LLM catalog readable through a refresh or a crash
      description: >-
        llm.json and llm_catalog_refresh.json are now written to a temporary file, flushed to disk and
        renamed into place, and llm.json.bak is a copy, so a refresh no longer leaves a moment with no
        built-in catalog, during which costs were 0 and the model gate was off. The runtime keeps the
        last catalog it read while llm.json cannot be read. The publication is recorded before the catalog
        is installed, so a crash cannot let its version_id be reused, and a failed install puts the record
        back. A refresh no longer undoes an administrator edit made while it ran. Refreshes and rollbacks,
        with or without llm_catalog.refresh_url, now run one at a time. Base URL checks of added providers
        no longer block other catalog edits. An unreadable record is logged at startup, and a refreshed
        catalog with no record logs a warning.
  removed: []
  security:
    - timestamp: '2026-11-19T05:41:50.000Z'
      title: Stop a refreshed catalog from redirecting provider API keys
      description: >-
        Affected: 1.0.0 to 1.0.2. Fixed: the release after 1.0.2. A refreshed catalog could change a
        built-in provider's default_base_url, so every provider key was sent to a host the published file
        named, without the private-address check a custom provider gets. The refresh now keeps the stored
        connection and key settings, refuses a publication older than the accepted one, a changed or
        reused publication, and a catalog whose SHA-256 or size does not match the manifest. A rollback
        keeps the accepted publication sequence, so an older publication cannot be replayed afterwards.
    - timestamp: '2026-11-19T12:00:00.000Z'
      title: Stop a refreshed catalog from taking over providers or endpoint hosts
      description: >-
        Affected: 1.0.0 to 1.0.2. Fixed: the release after 1.0.2. A refresh could add a provider whose id
        matched a custom provider, which then sent that provider's key to the publisher's base URL. It
        could also set an endpoint path to a full URL, choosing the host that receives a provider's key,
        and a provider it added stayed callable because its models were enabled. A refresh now skips a
        new provider whose id matches a custom provider and logs a warning, refuses an endpoint path that
        does not start with a single '/', and adds a new provider with each of its models disabled.
  breaking:
    - timestamp: '2026-11-19T05:41:50.000Z'
      title: Point llm_catalog.refresh_url at a catalog manifest, not a catalog file
      description: >-
        llm_catalog.refresh_url must now name a manifest with schema_version 1, publication_sequence,
        version_id, version, catalogue_url (same host as refresh_url), sha256, size_bytes and
        published_at. A refresh_url that still names a catalog file fails its refresh with the catalog
        unchanged. Migration: publish a manifest next to the catalog file and set refresh_url to the
        manifest, as described in docs/PROVIDERS_AND_CREDENTIALS.md.
