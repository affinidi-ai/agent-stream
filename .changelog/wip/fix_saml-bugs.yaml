branch: fix/saml-bugs
changes:
  added:
    - timestamp: '2026-11-25T11:25:00.000Z'
      title: Report how each user signs in and when a kept record was deleted
      description: >-
        The user API returns sign_in_method (passkey, oidc or saml) for every user, so a client
        can tell before a delete whether the record will be removed or kept. It names the kind
        of account only; the provider account stays hidden until the record is kept. A deleted
        user's kept record also returns deleted_at.
    - timestamp: '2026-11-25T11:25:01.000Z'
      title: Say in the user.deleted event whether the record was removed or kept
      description: >-
        The user.deleted integration event carries an OUTCOME value, removed or kept, so an
        integration can tell a removed user from an OpenID Connect or SAML user whose record is
        kept disabled. Other user events send it empty, and the dashboard's generated user
        samples leave it out, since they serve every user event. It is listed with the user
        runtime variables and in the example configuration.
    - timestamp: '2026-11-25T17:40:00.000Z'
      title: Report stored Surfaces whose Prompt Guard rules cannot be evaluated
      description: >-
        At startup, and within one refresh interval when a Surface changes on disk, every
        enabled Prompt Guard rule of a stored Surface or Variant that cannot be evaluated is
        logged at ERROR naming the Surface, the rule and its side, and counted in the new
        agent_stream_prompt_guard_unusable_rules_total metric (labels side and reason). Such
        Surfaces refuse every request with 502, so administrators now see them before
        callers do. An unlabelled custom pattern is named by its position, never its regex.
  changed:
    - timestamp: '2026-11-25T11:25:02.000Z'
      title: Word user delete by sign-in method and mark deleted users on the Users page
      description: >-
        The delete button title, confirm notice and success message on the Users and Edit User
        pages now follow the user's sign-in method and the delete outcome. SAML users get the
        same kept-record notice as OpenID Connect users, passkey users see no OpenID Connect or
        SAML wording, and the Edit User page shows a success message after delete. Kept records
        show a DELETED badge, can be filtered with a Deleted status choice, and offer no delete
        button.
  fixed: []
  removed: []
  security:
    - timestamp: '2026-11-25T12:30:00.000Z'
      title: Keep passkeys and provider accounts out of user integration events
      description: >-
        Affects 1.0.2 and earlier; fixed in the next release. The OLD_STATE and NEW_STATE of
        user events sent the stored user record to integrations, including the user's passkey
        credentials and the OpenID Connect or SAML account of users who were never deleted,
        which the user API hides. They now hold the user as the user API returns it: no
        passkeys, the sign-in method, and the provider account only on a deleted user's kept
        record. An integration that read oidc or saml_id from a live user's state no longer
        receives them.
  breaking: []
