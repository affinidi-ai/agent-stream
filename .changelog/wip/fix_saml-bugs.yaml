branch: fix/saml-bugs
changes:
  added:
    - timestamp: '2026-11-25T11:25:00.000Z'
      title: Report how each user signs in and when a kept record was deleted
      description: >-
        The user API returns sign_in_method (passkey, oidc or saml) for every user, so a client
        can tell before a delete whether the record will be removed or kept. It names the kind
        of account only; the provider account stays hidden until the record is kept. A deleted
        user's kept record also returns deleted_at.
    - timestamp: '2026-11-25T11:25:01.000Z'
      title: Say in the user.deleted event whether the record was removed or kept
      description: >-
        The user.deleted integration event carries an OUTCOME value, removed or kept, so an
        integration can tell a removed user from an OpenID Connect or SAML user whose record is
        kept disabled. Other user events send it empty, and the dashboard's generated user
        samples leave it out, since they serve every user event. It is listed with the user
        runtime variables and in the example configuration.
    - timestamp: '2026-11-25T17:40:00.000Z'
      title: Report stored Surfaces whose Prompt Guard rules cannot be evaluated
      description: >-
        At startup, and, when cache_refresh_interval_secs is above 0, within one refresh
        interval of a Surface changing on disk, every enabled Prompt
        Guard rule of a stored Surface or enabled Variant that cannot be evaluated is logged
        at ERROR naming the Surface, the rule and its side, and counted in the new
        agent_stream_prompt_guard_unusable_rules_total metric (labels side and reason).
        Disabled Surfaces and Variants are skipped, since no request reaches them.
        Requests those rules guard are refused with 502, so administrators now see them
        before callers do. An unlabelled custom pattern is named by its position, never its
        regex.
  changed:
    - timestamp: '2026-11-25T11:25:02.000Z'
      title: Word user delete by sign-in method and mark deleted users on the Users page
      description: >-
        The delete button title, confirm notice and success message on the Users and Edit User
        pages now follow the user's sign-in method and the delete outcome. SAML users get the
        same kept-record notice as OpenID Connect users, passkey users see no OpenID Connect or
        SAML wording, and the Edit User page shows a success message after delete. Kept records
        show a DELETED badge, can be filtered with a Deleted status choice, and offer no delete
        button.
  fixed:
    - timestamp: '2026-11-26T09:00:00.000Z'
      title: Stop a stale or racing user update from approving a user deleted meanwhile
      description: >-
        PUT /v1/users/{user_id} with status approved restored a kept record when a delete
        landed after the request was authorised against the live user, so a stale Edit User
        page, a quick approve or an API client could let a deleted user sign in again
        without the approval checks. Such an update is now refused with 409 and changes
        nothing: its role, status and profile fields are written in one step, so a delete
        landing between them can no longer get names or an email written back onto the
        kept record. A user's own profile edit that finishes after their delete now
        answers 404 and leaves the record as the delete left it. The Edit User page also
        sends only the fields the administrator changed, nothing when nothing changed, and
        nothing at all when the user did not load.
    - timestamp: '2026-11-26T09:00:01.000Z'
      title: Answer a concurrent delete of a passkey user with removed, not 500
      description: >-
        When two deletes of a passkey user ran at once, the second answered 500 because the
        record was already gone. It now answers 200 with outcome removed and sends no second
        user.deleted event. A delete sent after the user is gone still answers 404.
  removed: []
  security:
    - timestamp: '2026-11-25T12:30:00.000Z'
      title: Keep passkeys and provider accounts out of user integration events
      description: >-
        Affects 1.0.2 and earlier; fixed in the next release. The OLD_STATE and NEW_STATE of
        user events sent the stored user record to integrations, including the user's passkey
        credentials and the OpenID Connect or SAML account, which the user API shows only to
        readers of users while configuring a user integration needs only integrations.edit.
        They now hold the user as the user API returns it, without passkeys or the provider
        account. See the breaking entry for the migration.
  breaking:
    - timestamp: '2026-11-26T09:00:02.000Z'
      title: Drop passkeys, oidc and saml_id from user event OLD_STATE and NEW_STATE
      description: >-
        The OLD_STATE and NEW_STATE values of the user.created, user.approved,
        user.updated, user.deleted, user.login and user.accessed integration events no longer
        contain passkeys, oidc or saml_id, including on the user.approved event for a deleted
        user's kept record, and now contain sign_in_method (and deleted_at on a kept record).
        An integration that read the provider account from them must identify the user by
        USER_ID or user_id instead, and read sign_in_method to tell how the user signs in.
        Every user event now also sets the OUTCOME value (empty except on user.deleted),
        which replaces a custom trigger variable named OUTCOME; rename such a variable.
