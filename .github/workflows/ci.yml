name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Static Rust checks live in checks.yml. This workflow owns frontend, docs,
  # Gherkin linting, changelog fragments, runtime tests, coverage, BDD, and
  # smoke validation. The appliance testkit (make test-integration) needs
  # docker-compose and runs before a release, not here.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'tests/**'
              - 'scripts/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Makefile'
            frontend:
              - 'www/default/**'

  frontend:
    name: Frontend - format, lint, test, build
    runs-on: ubuntu-latest
    needs: changes
    # Always runs on push to main; on pull requests, only for frontend changes.
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: www/default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: www/default/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        # Non-blocking: a newly-published advisory should not break unrelated PRs.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        env:
          CI: true
        run: npm test -- --watchAll=false

      - name: Build
        run: npm run build

  docs:
    name: Documentation references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate local links and documented Make targets
        run: python3 .github/scripts/check_docs.py

  gherkin:
    name: BDD Gherkin lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the linter itself
        run: |
          python3 -m py_compile scripts/bdd-gherkin.py
          python3 scripts/bdd-gherkin.py --self-test

      - name: Lint feature files and step bindings
        run: python3 scripts/bdd-gherkin.py --lint

  changelog:
    name: Changelog fragment validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Install validator dependencies
        run: python3 -m pip install PyYAML

      - name: Test changelog fragment validation
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Validate release PR changelog
        if: github.event_name == 'pull_request'
        run: python3 .github/scripts/changelog.py check

      - name: Require a changelog fragment change on pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' && (!startsWith(github.head_ref, 'release/') || github.event.pull_request.user.type != 'Bot')
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -Fxq "CHANGELOG.md"; then
            echo "::error::Ordinary pull requests must update changelog fragments, not CHANGELOG.md directly."
            exit 1
          fi
          fragment=".changelog/wip/${HEAD_REF//\//_}.yaml"
          if ! git diff --name-status --find-renames --diff-filter=AMR \
            "origin/${BASE_REF}...HEAD" | awk -F '\t' -v expected="${fragment}" '
              ($1 == "A" || $1 == "M") && $2 == expected { found = 1 }
              $1 ~ /^R[0-9]+$/ && $3 == expected { found = 1 }
              END { exit !found }
            '; then
            echo "::error::Pull requests must add, modify, or rename ${fragment}."
            exit 1
          fi
          python3 .github/scripts/changelog.py check --require "${HEAD_REF}"

  test:
    name: Test - unit and component
    runs-on: ubuntu-latest
    needs: changes
    # Always runs on push to main; on pull requests, only for Rust changes.
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    # Owned here rather than via pipeline-rust/test.yaml: that workflow runs a
    # bare `cargo test`, which builds every target of this crate at once (the
    # bin, the bin under cfg(test), and the BDD binaries) and is OOM-killed.
    # Scoping to the single bin target is what keeps it in memory.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libclang-dev libcurl4-openssl-dev libdbus-1-dev \
            libsasl2-dev libsasl2-modules libssl-dev libxml2-dev libxmlsec1-dev \
            pkg-config protobuf-compiler xmlsec1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.95.0

      # One cache for every dev-profile job. Per-job caches each hold a
      # multi-GB target dir and evict one another out of the repository's 10 GB
      # budget, so every job rebuilds from cold.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-dev

      - name: Prepare test environment
        run: make config-test

      # Compiling and running are separate steps so an OOM is attributable to
      # the build rather than to a test.
      - name: Build test binary
        run: cargo test --bin agent-stream --all-features --no-run

      - name: Run unit and component tests
        run: cargo test --bin agent-stream --all-features --no-fail-fast

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: changes
    # Always runs on push to main; on pull requests, only for Rust changes.
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    env:
      # The required line-coverage floor for this service.
      COVERAGE_THRESHOLD: "37"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libclang-dev libcurl4-openssl-dev libdbus-1-dev \
            libsasl2-dev libsasl2-modules libssl-dev libxml2-dev libxmlsec1-dev \
            pkg-config protobuf-compiler xmlsec1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.95.0
          components: llvm-tools-preview

      # Separate from rust-dev: llvm-cov builds instrumented artifacts.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov

      - name: Prepare test environment
        run: make config-test

      # Scoped to the binary target for the same memory reason as the test job;
      # the summary is written even when the threshold check fails.
      - name: Measure line coverage
        run: |
          set +e
          set -o pipefail
          cargo llvm-cov --bin agent-stream --all-features --summary-only \
            --fail-under-lines "${COVERAGE_THRESHOLD}" 2>&1 | tee coverage.txt
          status=$?
          {
            echo "### Coverage (threshold ${COVERAGE_THRESHOLD}% lines)"
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-summary
          path: coverage.txt
          if-no-files-found: warn

  surface-bdd:
    name: BDD - surface suite
    runs-on: ubuntu-latest
    needs: changes
    # Always runs on push to main; on pull requests, only for Rust changes.
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libclang-dev libcurl4-openssl-dev libdbus-1-dev \
            libsasl2-dev libsasl2-modules libssl-dev libxml2-dev libxmlsec1-dev \
            pkg-config protobuf-compiler xmlsec1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.95.0

      - name: Cache cargo build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-dev

      # Each scenario spawns the real appliance binary on a dynamically reserved
      # port and self-signs its own certificates, so no prepared environment or
      # mediator is needed. Concurrency defaults to min(cpus, 4); lower it with
      # BDD_MAX_CONCURRENT_SCENARIOS if scenarios start timing out.
      - name: Run surface BDD scenarios
        run: cargo test --test surface_bdd

  smoke:
    name: Smoke - backend boots and reports healthy
    runs-on: ubuntu-latest
    needs: changes
    # Always runs on push to main; on pull requests, only for Rust changes.
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    # Exercises the documented Linux quick start (build -> prepare env -> boot
    # -> GET /api/v1/health). Non-blocking: a failure here does not fail the run.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake jq libclang-dev libcurl4-openssl-dev libdbus-1-dev \
            libsasl2-dev libsasl2-modules libssl-dev libxml2-dev libxmlsec1-dev \
            pkg-config protobuf-compiler xmlsec1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.95.0

      - name: Cache cargo build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-dev

      - name: Build appliance binary
        run: cargo build --bin agent-stream

      - name: Prepare local environment (non-interactive)
        run: make config-debug-dev

      - name: Boot appliance and check readiness
        run: |
          export AS_BACKUP_ENCRYPTION_KEY="$(cat envs/backup_encryption_key)"
          export AS_MASTER_KEY="$(cat envs/master_key)"
          cd envs/local
          "${GITHUB_WORKSPACE}/target/debug/agent-stream" --config config/config.toml &
          appliance_pid=$!
          cd "${GITHUB_WORKSPACE}"
          trap 'kill "${appliance_pid}" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if response="$(curl -ksS --fail-with-body --write-out $'\n%{content_type}' https://localhost:8443/api/v1/health 2>/dev/null)"; then
              content_type="${response##*$'\n'}"
              body="${response%$'\n'*}"
              if [[ "${content_type}" == application/json* ]] && \
                jq -e '.status == "OK"' <<<"${body}" >/dev/null; then
                echo "Appliance reported healthy after ${i}s."
                exit 0
              fi
            fi
            if ! kill -0 "${appliance_pid}" 2>/dev/null; then
              echo "::error::Appliance process exited before becoming healthy."
              exit 1
            fi
            sleep 1
          done
          echo "::error::Appliance did not report healthy within 60s."
          exit 1
