# Run Agent Stream from a locally built image.
#
# Prerequisites:
#   1. Generate a runnable config (REQUIRED):   make config-docker
#      Builds the agent-stream:local image, then creates envs/docker/config
#      (config.toml, agent-stream.json) and envs/docker/certs, with the WebAuthn
#      relying party defaulted to localhost so the container starts as-is.
#      Without this, compose stops with "source path does not exist" instead of
#      a cryptic in-container error.
#   2. Provide a 64-character hex backup key. `make config-docker` writes one to
#      envs/backup_encryption_key:
#      export AS_BACKUP_ENCRYPTION_KEY=$(cat envs/backup_encryption_key)
#   3. Provide the encryption-at-rest master key. The generated config.toml encrypts
#      storage with key_source = "environment"; `make config-docker` writes a key to
#      envs/master_key. Keep it: storage written under it cannot be read without it.
#      export AS_MASTER_KEY=$(cat envs/master_key)
#
# Then: docker compose up
#   Dashboard: https://localhost:8443/    (accept the self-signed certificate)
#   Readiness: curl -k https://localhost:8443/api/v1/health
#   Liveness:  curl -k https://localhost:8443/api/v1/alive
#
# Storage lives at envs/docker/_storage on the host, alongside the generated
# config. To start clean (and re-seed the quickstart surface):
#   docker compose down && rm -rf envs/docker && make config-docker
#
# The container runs as the non-root uid/gid 10001. On Linux, `make config-docker`
# gives envs/docker/_storage, envs/docker/_backup_restore and envs/docker/certs
# to that uid (with sudo), so deleting them there also needs sudo.
#
# For a real deployment, override webauthn.rp_id, webauthn.external_origin, and
# did.domain in envs/docker/config/agent-stream.json with your public host, and
# remove the 127.0.0.1 prefix from `ports` below so other hosts can reach it.
# Browser passkey login requires that WebAuthn origin to match the URL you open.
# Also set `[did_cache] allow_private_hosts = false` in
# envs/docker/config/config.toml: the generated dev config turns it on so DID
# resolution can reach a localhost mediator.

services:
  agent-stream:
    image: agent-stream:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-stream-dev
    # A dashboard backup restore exits with code 1 twice: once after staging
    # backup.asbak, and once at the next start after applying it. A bounded
    # on-failure policy restarts through both, while a config or permissions
    # error still stops after three attempts instead of crash-looping.
    restart: on-failure:3
    security_opt:
      - no-new-privileges:true
    # Published on loopback only; see the deployment note at the top of this file.
    ports:
      - "127.0.0.1:8443:8443"   # HTTPS listener — dashboard, passkey origin, LLM Surfaces
      - "127.0.0.1:8080:8080"   # HTTP listener
    # Lets an LLM Surface reach a model server on the host, such as Ollama at
    # http://host.docker.internal:11434/v1 (Docker Desktop provides this name;
    # the mapping adds it on Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RUST_LOG: info
      # Required. Encrypts backups; must be a 64-character hex string. The :? guard
      # aborts every compose command (including `down`) until it is exported.
      AS_BACKUP_ENCRYPTION_KEY: ${AS_BACKUP_ENCRYPTION_KEY:-${AGENT_STREAM_BACKUP_ENCRYPTION_KEY:?set a 64-char hex key, e.g. export AS_BACKUP_ENCRYPTION_KEY=$(cat envs/backup_encryption_key)}}
      # Required. Master key for encryption at rest (64 hex characters).
      AS_MASTER_KEY: ${AS_MASTER_KEY:-${AGENT_STREAM_MASTER_KEY:?set the master key, e.g. export AS_MASTER_KEY=$(cat envs/master_key)}}
    volumes:
      # Generated by `make config-docker`. create_host_path:false makes compose
      # fail loudly if the config is missing instead of mounting an empty dir.
      # Agent Stream only reads config/certs; it writes to /app/_storage and
      # /app/_backup_restore.
      - type: bind
        source: ./envs/docker/config
        target: /app/config
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./envs/docker/certs
        target: /app/certs
        read_only: true
        bind:
          create_host_path: false
      # Persistent JSON storage. Bind-mounted under envs/docker so evaluation
      # data lives beside the generated config and matches `make docker-run`.
      # create_host_path lets compose create it.
      - type: bind
        source: ./envs/docker/_storage
        target: /app/_storage
        bind:
          create_host_path: true
      # Where a dashboard restore stages backup.asbak before restarting. Mounted
      # so the staged backup survives the restart and `docker compose down`.
      - type: bind
        source: ./envs/docker/_backup_restore
        target: /app/_backup_restore
        bind:
          create_host_path: true
    depends_on:
      mock-llm:
        condition: service_healthy
    healthcheck:
      # -k accepts the self-signed cert; /api/v1/health returns 200 only when
      # Agent Stream is ready to serve.
      test: ["CMD", "curl", "-fsk", "https://localhost:8443/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Mock OpenAI-protocol model server (tests/appliance/mock-llm) so the quickstart works
  # without a provider account or API key. It returns a fixed reply and calls no
  # real model. `make config-docker` seeds an LLM Surface at /llm/quickstart that
  # targets it; it is reachable only from the compose network.
  mock-llm:
    image: node:22.23.4-alpine
    container_name: agent-stream-mock-llm
    working_dir: /app
    command: ["node", "server.js"]
    user: node
    security_opt:
      - no-new-privileges:true
    environment:
      MOCK_LLM_PORT: 9000
      MOCK_LLM_MIN_MS: 100
      MOCK_LLM_MAX_MS: 400
    volumes:
      - type: bind
        source: ./tests/appliance/mock-llm
        target: /app
        read_only: true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/health"]
      interval: 3s
      timeout: 2s
      retries: 10
